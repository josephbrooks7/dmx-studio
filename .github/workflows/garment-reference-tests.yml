name: Garment fitting reference tests
on:
  push:
    branches: ['assets/female-body-kit-reference']
    paths:
      - 'packaging/body_fit.py'
      - 'packaging/garment_*.py'
      - 'packaging/blender_garment_fit.py'
      - 'packaging/blender-garment-smoke.py'
      - 'packaging/inspect-body-reference.py'
      - 'packaging/inspect-body-candidates.py'
      - 'packaging/test_*.py'
      - '.github/workflows/garment-reference-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile fitting modules
        run: python3 -m py_compile packaging/body_fit.py packaging/garment_regions.py packaging/garment_skin.py packaging/garment_clearance.py packaging/garment_pipeline.py packaging/blender_garment_fit.py packaging/inspect-body-reference.py
      - name: Run offline fitting regression suite
        working-directory: packaging
        run: python3 -m unittest -v test_body_fit test_garment_regions test_garment_skin test_garment_clearance test_garment_pipeline
  blender-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender from Ubuntu repository
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender
          blender --version
      - name: Verify fitted geometry, materials and target skeleton
        run: blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python packaging/blender-garment-smoke.py
      - name: Retrieve existing body candidates from Git LFS
        run: git lfs pull --include="packaging/character-candidates/bodies/*.usdz" --exclude=""
      - name: Inspect actual male and female body candidate meshes
        run: blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python packaging/inspect-body-candidates.py -- packaging/character-candidates/bodies/male.usdz packaging/character-candidates/bodies/female.usdz body-candidate-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: body-candidate-inventory
          path: body-candidate-report.json
          if-no-files-found: error
