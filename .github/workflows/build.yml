name: Build DMG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build universal app + DMG (Intel and Apple Silicon, macOS 12+)
        run: VERSION="1.0.${{ github.run_number }}" packaging/build-dmg.sh --universal
      - name: Check architectures, minimum macOS and linked libraries
        run: |
          ls -d /Applications/Xcode*.app || true
          otool -L "build/DMX Studio.app/Contents/MacOS/DMXStudio"
          otool -l "build/DMX Studio.app/Contents/MacOS/DMXStudio" | grep -A2 LC_RPATH || true
          lipo -info "build/DMX Studio.app/Contents/MacOS/DMXStudio"
          otool -l "build/DMX Studio.app/Contents/MacOS/DMXStudio" | grep -A4 LC_BUILD_VERSION | head -10
          for k in NSMicrophoneUsageDescription NSLocalNetworkUsageDescription NSSpeechRecognitionUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$k" "build/DMX Studio.app/Contents/Info.plist" || { echo "Missing $k"; exit 1; }
          done
      - name: Audio detection test - Learn a song with known answers
        run: |
          python3 packaging/make_test_song.py /tmp/test.wav
          afconvert -f m4af -d aac /tmp/test.wav /tmp/test.m4a
          BIN="build/DMX Studio.app/Contents/MacOS/DMXStudio"
          for f in /tmp/test.wav /tmp/test.m4a; do
            echo "===== $f"
            "$BIN" --analyze "$f" | tee /tmp/out.txt
            python3 - <<'PY'
          import re, sys
          o = open('/tmp/out.txt').read()
          bpm = float(re.search(r'bpm=([\d.]+)', o).group(1))
          beats = [float(v) for v in re.search(r'firstBeats=([\d.,]+)', o).group(1).split(',')]
          ok = True
          def check(cond, msg):
              global ok
              print(('PASS ' if cond else 'FAIL ') + msg); ok = ok and cond
          check(127.2 <= bpm <= 128.8, f'tempo {bpm} ~ 128')
          kicks = int(re.search(r'kicks=(\d+)', o).group(1)); snares = int(re.search(r'snares=(\d+)', o).group(1))
          check(120 <= kicks <= 136, f'{kicks} kicks ~ 128')
          st = [float(v) for v in re.search(r'snareTimes=([\d.,]*)', o).group(1).split(',') if v]
          beat = 60 / 128
          true_s = [2 + k * beat for k in range(64, 128) if k % 2 == 1]
          fp = [t for t in st if min(abs(t - u) for u in true_s) > 0.05]
          ph = [round(((t - 2) / beat) % 2, 2) for t in fp]
          print('false snares:', len(fp), 'beat phases (0/1 = kick beats, .5/1.5 = hi-hat offbeats):', ph[:30])
          check(26 <= snares <= 38, f'{snares} snares ~ 32')
          check(abs(beats[0] - 2.0) < 0.06, f'first beat {beats[0]:.3f}s ~ 2.000s (on the kick)')
          check(re.search(r'silences=0\.00-', o) is not None, 'silent lead-in detected')
          ms, me = [float(v) for v in re.search(r'musicStart=([\d.]+) musicEnd=([\d.]+)', o).groups()]
          check(abs(ms - 2.0) < 0.1, f'music starts at {ms:.2f}s ~ 2.00s')
          check(61.0 < me < 62.6, f'music ends at {me:.2f}s ~ 61.9s (3 s silent tail)')
          secs = re.findall(r'section (.+?) ([\d.]+)-([\d.]+) (\w+)', o)
          check(len(secs) >= 2, f'{len(secs)} sections found')
          loud = [s for s in secs if s[3] in ('High', 'Drop') and float(s[1]) >= 25]
          check(len(loud) >= 1 and abs(float(loud[0][1]) - 32.0) < 4.0, 'loud part found starting near 32s')
          check(re.search(r'groove=Normal', o) is not None, 'groove: normal (not half-time) for a 4/4 backbeat song')
          print(re.search(r'genres=.*', o).group(0))
          check('framesWithLight=' in o and int(re.search(r'framesWithLight=(\d+)', o).group(1)) > 150, 'show lights up')
          sys.exit(0 if ok else 1)
          PY
          done
          grep -q "title=Test Groove artist=Red Velvet Test" <("$BIN" --analyze /tmp/test.wav) && echo "PASS tags read (title + artist)"
      - name: Stem splitter test - bass-heavy, sparse vocal, drums + vocals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet numpy 2>/dev/null || python3 -m pip install --quiet --break-system-packages numpy
          BIN="build/DMX Studio.app/Contents/MacOS/DMXStudio"
          mkdir -p /tmp/v
          python3 packaging/make_verify_song.py /tmp/v/verify.wav --parts
          START=$(date +%s)
          "$BIN" --analyze /tmp/v/verify.wav --stems /tmp/v/stems | tee /tmp/v/out.txt
          echo "split + learn took $(( $(date +%s) - START )) s for a 60 s song"
          ls -la /tmp/v/stems
          DMX_DEBUG_KICK=1 "$BIN" --analyze /tmp/v/verify.wav | grep "^dbg" > /tmp/v/dbg.txt || true
          head -3 /tmp/v/dbg.txt; grep -E "t=(42\.4|49\.5|49\.6|54\.4|40\.0|44\.8)" /tmp/v/dbg.txt || true
          python3 packaging/check_stems.py /tmp/v/out.txt /tmp/v/verify.wav /tmp/v/stems
          echo "--- High Quality (AI) split"
          if gh release download hq-model-1 -R "$GITHUB_REPOSITORY" -p "DemucsHQ.mlmodelc.zip" -p "check.json" -D /tmp/hq 2>/dev/null; then
            (cd /tmp/hq && ditto -x -k DemucsHQ.mlmodelc.zip .)
            if gh release download hq-model-1 -R "$GITHUB_REPOSITORY" -p "DemucsVox.mlmodelc.zip" -D /tmp/hq 2>/dev/null; then
              (cd /tmp/hq && ditto -x -k DemucsVox.mlmodelc.zip .); export VOX=1; echo "with the vocals specialist"
            fi
            START=$(date +%s)
            "$BIN" --analyze /tmp/v/verify.wav --stems /tmp/v/hqstems --hq-model /tmp/hq/DemucsHQ.mlmodelc | grep -E "kicks=|vocalPhrases|stems="
            echo "high quality split + learn took $(( $(date +%s) - START )) s for a 60 s song"
            python3 packaging/check_hq.py /tmp/v/verify.wav /tmp/v/hqstems /tmp/hq/check.json
            "$BIN" --analyze /tmp/v/verify.wav --stems /tmp/v/hqstems2 --hq-model /tmp/hq/DemucsHQ.mlmodelc > /tmp/v/hqout.txt
            python3 packaging/check_stems.py /tmp/v/hqout.txt /tmp/v/verify.wav /tmp/v/hqstems2 2>&1 | grep -E "kick|snare|hat|vocal phrases"
          else echo "model not published yet: skipped"; fi
          python3 packaging/make_structure_song.py /tmp/v/pop.wav
          DMX_DEBUG_STRUCTURE=1 "$BIN" --analyze /tmp/v/pop.wav > /tmp/v/pop.txt; grep -E "bpm=|vocalPhrases|^seg|Group" /tmp/v/pop.txt | cut -c1-200
          python3 packaging/check_structure.py /tmp/v/pop.txt /tmp/v/pop.truth.json
          echo "--- same song as a performance track (no lead vocal)"
          python3 packaging/make_structure_song.py /tmp/v/track.wav --no-vocals
          DMX_DEBUG_STRUCTURE=1 "$BIN" --analyze /tmp/v/track.wav > /tmp/v/track.txt; grep -E "^seg|Group" /tmp/v/track.txt
          python3 packaging/check_structure.py /tmp/v/track.txt /tmp/v/track.truth.json
          python3 packaging/make_halftime_song.py /tmp/v/half.wav
          "$BIN" --analyze /tmp/v/half.wav | grep -E "bpm=|groove=|genres=" | tee /tmp/v/half.txt
          grep -q "groove=Half-time" /tmp/v/half.txt && echo "PASS half-time groove detected (140 BPM felt as 70)" || { echo "FAIL half-time groove not detected"; exit 1; }
      - name: Lyrics test (bundled Whisper, word timing, meaning, cues)
        run: |
          APP="build/DMX Studio.app"
          if [ -x "$APP/Contents/Resources/whisper-cli" ]; then
            if nm -u "$APP/Contents/Resources/whisper-cli" | grep -i NEWLAPACK; then echo "FAIL whisper-cli needs macOS 13.3"; exit 1; fi
            curl -sL -o /tmp/tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
            # the runner's voice is sometimes not ready and writes a near-empty clip: try again
            for n in 1 2 3 4 5; do
              say -o /tmp/l.aiff "I'm lost in the darkness and I'm all alone. But I can finally see the light."
              d=$(afinfo /tmp/l.aiff | awk '/estimated duration/{print int($3)}')
              echo "voice clip: ${d}s"; [ "${d:-0}" -ge 2 ] && break; sleep 3
            done
            afconvert -f m4af -d aac /tmp/l.aiff /tmp/l.m4a
            DMX_DEBUG_WHISPER=1 "$APP/Contents/MacOS/DMXStudio" --test-lyrics /tmp/l.m4a /tmp/tiny.bin | tee /tmp/lyr.txt
            grep -qi "light" /tmp/lyr.txt && echo "PASS words heard with timing" || { echo "FAIL lyrics"; exit 1; }
          else echo "whisper-cli not bundled yet: skipped"; fi
      - name: Helper processes (Wi-Fi scan + Learn run outside the app)
        run: |
          BIN="build/DMX Studio.app/Contents/MacOS/DMXStudio"
          OUT=$("$BIN" --scan-artnet); echo "scan output: $OUT"
          echo "$OUT" | python3 -c "import json,sys; json.load(sys.stdin); print('PASS scan helper returns device list')"
          python3 packaging/make_test_song.py /tmp/h.wav >/dev/null
          "$BIN" --learn /tmp/h.wav /tmp/h.json | tail -1
          python3 -c "import json; a=json.load(open('/tmp/h.json')); assert 127 < a['bpm'] < 129; print('PASS learn helper wrote analysis, bpm', round(a['bpm'],1))"
          set +e; "$BIN" --learn /tmp/does-not-exist.wav /tmp/x.json; code=$?; set -e
          [ $code -ne 0 ] && echo "PASS learn helper reports a missing file instead of crashing (exit $code)"
      - name: Light signal check (acts like the PKnight)
        run: |
          BIN="build/DMX Studio.app/Contents/MacOS/DMXStudio"
          python3 packaging/artnet_check.py 6 &
          L=$!
          sleep 0.5
          DMX_TEST_ARTNET_IP=127.0.0.1 "$BIN" >/dev/null 2>&1 &
          P=$!
          wait $L; R=$?
          kill $P || true
          exit $R
      - name: Snare diagnostics
        if: always()
        run: |
          python3 packaging/make_test_song.py /tmp/test.wav >/dev/null
          DMX_DEBUG_SNARE=1 "build/DMX Studio.app/Contents/MacOS/DMXStudio" --analyze /tmp/test.wav | grep "^cand" | python3 -c "
          import sys,re
          beat=60/128
          rows=[]
          for line in sys.stdin:
              t,b,c,ba,h=[float(v) for v in re.findall(r'=([\d.]+)',line)]
              k=(t-2)/beat; ph=k%2; loud=k>=63.5
              kind='SNARE' if loud and abs(ph-1)<0.1 else ('kick' if min(ph,2-ph)<0.1 else 'hat/other')
              rows.append((kind,b,c,ba,h))
          for kind in ('SNARE','kick','hat/other'):
              r=[x for x in rows if x[0]==kind]
              if r: print(kind, len(r), 'body min/max %.2f/%.2f crack min/max %.2f/%.2f bass min/max %.2f/%.2f' % (min(x[1] for x in r),max(x[1] for x in r),min(x[2] for x in r),max(x[2] for x in r),min(x[3] for x in r),max(x[3] for x in r)))
          "
      - name: Smoke test - launch the app and make sure it stays running
        run: |
          APPBIN="build/DMX Studio.app/Contents/MacOS/DMXStudio"
          "$APPBIN" > /tmp/app.log 2>&1 &
          PID=$!
          sleep 12
          if kill -0 $PID 2>/dev/null; then
            echo "APP STILL RUNNING after 12s - OK"
            kill $PID
          else
            wait $PID; echo "APP EXITED with code $?"
            echo "---- app output ----"; cat /tmp/app.log
            echo "---- crash reports ----"
            ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5
            f=$(ls -t ~/Library/Logs/DiagnosticReports/DMXStudio* 2>/dev/null | head -1)
            [ -n "$f" ] && head -120 "$f"
            exit 1
          fi
          echo "---- app output ----"; cat /tmp/app.log | head -50
      - name: Library always saves and loads (odd values, a damaged song)
        run: '"build/DMX Studio.app/Contents/MacOS/DMXStudio" --test-library'
      - name: Session export and import round trip
        run: |
          python3 packaging/make_test_song.py /tmp/pkg.wav >/dev/null
          "build/DMX Studio.app/Contents/MacOS/DMXStudio" --test-package /tmp/pkg.wav
          ls -la ~/Documents/DMX\ Studio/Songs/ | head
      - name: Live mode stress test (3 minutes of random live use)
        run: |
          BIN="build/DMX Studio.app/Contents/MacOS/DMXStudio"
          for TAB in Live Stage; do
            DMX_DEMO_OPEN=1 DMX_DEMO_TAB=$TAB DMX_TEST_LIVE_STRESS=1 "$BIN" > /tmp/stress-$TAB.log 2>&1 &
            P=$!
            sleep 90
            if kill -0 $P 2>/dev/null; then
              echo "$TAB: still running after 90 s"; tail -3 /tmp/stress-$TAB.log; kill $P; sleep 1
            else
              echo "$TAB: CRASHED"; cat /tmp/stress-$TAB.log
              cat ~/Library/Application\ Support/DMX\ Studio/*rash* 2>/dev/null || true
              ls -t ~/Library/Logs/DiagnosticReports/ | head -3
              f=$(ls -t ~/Library/Logs/DiagnosticReports/DMXStudio* 2>/dev/null | head -1); [ -n "$f" ] && head -120 "$f"
              exit 1
            fi
          done
      - name: Screenshots
        continue-on-error: true
        run: |
          mkdir -p /tmp/shots
          BIN="build/DMX Studio.app/Contents/MacOS/DMXStudio"
          python3 packaging/make_test_song.py /tmp/demo.wav >/dev/null
          shoot() {
            env "$@" "$BIN" >/dev/null 2>&1 &
            P=$!; sleep 14; screencapture -x "/tmp/shots/$NAME.png" || true; kill $P; sleep 2
          }
          NAME=1-sessions shoot DMX_DEMO_SONG=/tmp/demo.wav
          NAME=2-show shoot DMX_DEMO_OPEN=1 DMX_DEMO_PRESET=1
          NAME=3-live shoot DMX_DEMO_OPEN=1 DMX_DEMO_TAB=Live DMX_DEMO_PRESET=1
          NAME=4-songs shoot DMX_DEMO_OPEN=1 DMX_DEMO_TAB=Songs
          NAME=5-stage shoot DMX_DEMO_OPEN=1 DMX_DEMO_TAB=Stage DMX_DEMO_PRESET=1
          NAME=6-setlists shoot DMX_DEMO_OPEN=1 "DMX_DEMO_TAB=Set Lists" DMX_DEMO_SONG=/tmp/demo.wav DMX_DEMO_SET=1
          ls -la /tmp/shots
      - uses: actions/upload-artifact@v4
        with:
          name: DMX-Studio-dmg
          path: build/*.dmg
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" build/*.dmg --title "DMX Studio $TAG" \
            --notes "Download the .dmg, open it, and drag DMX Studio into Applications. First launch: right-click the app → Open." --latest
      - name: Copy DMG to dist branch
        run: |
          mkdir -p /tmp/dist && cp build/*.dmg /tmp/dist/DMX-Studio.dmg
          git config user.name "dmx-studio-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan dist
          git rm -rf . >/dev/null
          # the DMG (with the AI models built in) is too big for git: it's on the release; this just says which
          echo "v1.0.${{ github.run_number }}" > LATEST
          mkdir -p shots && cp /tmp/shots/*.png shots/ 2>/dev/null || true
          git add LATEST shots
          git commit -m "DMG build ${{ github.run_number }}"
          git push -f origin dist
