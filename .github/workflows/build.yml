name: Build DMG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build universal app + DMG (Intel and Apple Silicon, macOS 12+)
        run: VERSION="1.0.${{ github.run_number }}" packaging/build-dmg.sh --universal
      - name: Check architectures, minimum macOS and linked libraries
        run: |
          ls -d /Applications/Xcode*.app || true
          otool -L "build/DMX Studio.app/Contents/MacOS/DMXStudio"
          otool -l "build/DMX Studio.app/Contents/MacOS/DMXStudio" | grep -A2 LC_RPATH || true
          lipo -info "build/DMX Studio.app/Contents/MacOS/DMXStudio"
          otool -l "build/DMX Studio.app/Contents/MacOS/DMXStudio" | grep -A4 LC_BUILD_VERSION | head -10
          for k in NSMicrophoneUsageDescription NSLocalNetworkUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$k" "build/DMX Studio.app/Contents/Info.plist" || { echo "Missing $k"; exit 1; }
          done
      - name: Audio detection test - Learn a song with known answers
        run: |
          python3 packaging/make_test_song.py /tmp/test.wav
          afconvert -f m4af -d aac /tmp/test.wav /tmp/test.m4a
          BIN="build/DMX Studio.app/Contents/MacOS/DMXStudio"
          for f in /tmp/test.wav /tmp/test.m4a; do
            echo "===== $f"
            "$BIN" --analyze "$f" | tee /tmp/out.txt
            python3 - <<'PY'
          import re, sys
          o = open('/tmp/out.txt').read()
          bpm = float(re.search(r'bpm=([\d.]+)', o).group(1))
          beats = [float(v) for v in re.search(r'firstBeats=([\d.,]+)', o).group(1).split(',')]
          ok = True
          def check(cond, msg):
              global ok
              print(('PASS ' if cond else 'FAIL ') + msg); ok = ok and cond
          check(127.2 <= bpm <= 128.8, f'tempo {bpm} ~ 128')
          kicks = int(re.search(r'kicks=(\d+)', o).group(1)); snares = int(re.search(r'snares=(\d+)', o).group(1))
          check(120 <= kicks <= 136, f'{kicks} kicks ~ 128')
          st = [float(v) for v in re.search(r'snareTimes=([\d.,]*)', o).group(1).split(',') if v]
          beat = 60 / 128
          true_s = [2 + k * beat for k in range(64, 128) if k % 2 == 1]
          fp = [t for t in st if min(abs(t - u) for u in true_s) > 0.05]
          ph = [round(((t - 2) / beat) % 2, 2) for t in fp]
          print('false snares:', len(fp), 'beat phases (0/1 = kick beats, .5/1.5 = hi-hat offbeats):', ph[:30])
          check(26 <= snares <= 38, f'{snares} snares ~ 32')
          check(abs(beats[0] - 2.0) < 0.06, f'first beat {beats[0]:.3f}s ~ 2.000s (on the kick)')
          check(re.search(r'silences=0\.00-', o) is not None, 'silent lead-in detected')
          ms, me = [float(v) for v in re.search(r'musicStart=([\d.]+) musicEnd=([\d.]+)', o).groups()]
          check(abs(ms - 2.0) < 0.1, f'music starts at {ms:.2f}s ~ 2.00s')
          check(61.0 < me < 62.6, f'music ends at {me:.2f}s ~ 61.9s (3 s silent tail)')
          secs = re.findall(r'section (.+?) ([\d.]+)-([\d.]+) (\w+)', o)
          check(len(secs) >= 2, f'{len(secs)} sections found')
          loud = [s for s in secs if s[3] in ('High', 'Drop') and float(s[1]) >= 25]
          check(len(loud) >= 1 and abs(float(loud[0][1]) - 32.0) < 4.0, 'loud part found starting near 32s')
          check('framesWithLight=' in o and int(re.search(r'framesWithLight=(\d+)', o).group(1)) > 150, 'show lights up')
          sys.exit(0 if ok else 1)
          PY
          done
          grep -q "title=Test Groove artist=Red Velvet Test" <("$BIN" --analyze /tmp/test.wav) && echo "PASS tags read (title + artist)"
      - name: Helper processes (Wi-Fi scan + Learn run outside the app)
        run: |
          BIN="build/DMX Studio.app/Contents/MacOS/DMXStudio"
          OUT=$("$BIN" --scan-artnet); echo "scan output: $OUT"
          echo "$OUT" | python3 -c "import json,sys; json.load(sys.stdin); print('PASS scan helper returns device list')"
          python3 packaging/make_test_song.py /tmp/h.wav >/dev/null
          "$BIN" --learn /tmp/h.wav /tmp/h.json | tail -1
          python3 -c "import json; a=json.load(open('/tmp/h.json')); assert 127 < a['bpm'] < 129; print('PASS learn helper wrote analysis, bpm', round(a['bpm'],1))"
          set +e; "$BIN" --learn /tmp/does-not-exist.wav /tmp/x.json; code=$?; set -e
          [ $code -ne 0 ] && echo "PASS learn helper reports a missing file instead of crashing (exit $code)"
      - name: Light signal check (acts like the PKnight)
        run: |
          BIN="build/DMX Studio.app/Contents/MacOS/DMXStudio"
          python3 packaging/artnet_check.py 6 &
          L=$!
          sleep 0.5
          DMX_TEST_ARTNET_IP=127.0.0.1 "$BIN" >/dev/null 2>&1 &
          P=$!
          wait $L; R=$?
          kill $P || true
          exit $R
      - name: Snare diagnostics
        if: always()
        run: |
          python3 packaging/make_test_song.py /tmp/test.wav >/dev/null
          DMX_DEBUG_SNARE=1 "build/DMX Studio.app/Contents/MacOS/DMXStudio" --analyze /tmp/test.wav | grep "^cand" | python3 -c "
          import sys,re
          beat=60/128
          rows=[]
          for line in sys.stdin:
              t,b,c,ba,h=[float(v) for v in re.findall(r'=([\d.]+)',line)]
              k=(t-2)/beat; ph=k%2; loud=k>=63.5
              kind='SNARE' if loud and abs(ph-1)<0.1 else ('kick' if min(ph,2-ph)<0.1 else 'hat/other')
              rows.append((kind,b,c,ba,h))
          for kind in ('SNARE','kick','hat/other'):
              r=[x for x in rows if x[0]==kind]
              if r: print(kind, len(r), 'body min/max %.2f/%.2f crack min/max %.2f/%.2f bass min/max %.2f/%.2f' % (min(x[1] for x in r),max(x[1] for x in r),min(x[2] for x in r),max(x[2] for x in r),min(x[3] for x in r),max(x[3] for x in r)))
          "
      - name: Smoke test - launch the app and make sure it stays running
        run: |
          APPBIN="build/DMX Studio.app/Contents/MacOS/DMXStudio"
          "$APPBIN" > /tmp/app.log 2>&1 &
          PID=$!
          sleep 12
          if kill -0 $PID 2>/dev/null; then
            echo "APP STILL RUNNING after 12s - OK"
            kill $PID
          else
            wait $PID; echo "APP EXITED with code $?"
            echo "---- app output ----"; cat /tmp/app.log
            echo "---- crash reports ----"
            ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5
            f=$(ls -t ~/Library/Logs/DiagnosticReports/DMXStudio* 2>/dev/null | head -1)
            [ -n "$f" ] && head -120 "$f"
            exit 1
          fi
          echo "---- app output ----"; cat /tmp/app.log | head -50
      - name: Screenshots
        continue-on-error: true
        run: |
          mkdir -p /tmp/shots
          BIN="build/DMX Studio.app/Contents/MacOS/DMXStudio"
          python3 packaging/make_test_song.py /tmp/demo.wav >/dev/null
          shoot() {
            env "$@" "$BIN" >/dev/null 2>&1 &
            P=$!; sleep 14; screencapture -x "/tmp/shots/$NAME.png" || true; kill $P; sleep 2
          }
          NAME=1-sessions shoot DMX_DEMO_SONG=/tmp/demo.wav
          NAME=2-show shoot DMX_DEMO_OPEN=1 DMX_DEMO_PRESET=1
          NAME=3-live shoot DMX_DEMO_OPEN=1 DMX_DEMO_TAB=Live DMX_DEMO_PRESET=1
          NAME=4-songs shoot DMX_DEMO_OPEN=1 DMX_DEMO_TAB=Songs
          NAME=5-stage shoot DMX_DEMO_OPEN=1 DMX_DEMO_TAB=Stage DMX_DEMO_PRESET=1
          ls -la /tmp/shots
      - uses: actions/upload-artifact@v4
        with:
          name: DMX-Studio-dmg
          path: build/*.dmg
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" build/*.dmg --title "DMX Studio $TAG" \
            --notes "Download the .dmg, open it, and drag DMX Studio into Applications. First launch: right-click the app → Open." --latest
      - name: Copy DMG to dist branch
        run: |
          mkdir -p /tmp/dist && cp build/*.dmg /tmp/dist/DMX-Studio.dmg
          git config user.name "dmx-studio-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan dist
          git rm -rf . >/dev/null
          cp /tmp/dist/DMX-Studio.dmg .
          mkdir -p shots && cp /tmp/shots/*.png shots/ 2>/dev/null || true
          git add DMX-Studio.dmg shots
          git commit -m "DMG build ${{ github.run_number }}"
          git push -f origin dist
