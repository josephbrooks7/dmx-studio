name: Build DMG
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build universal app + DMG (Intel and Apple Silicon, macOS 12+)
        run: VERSION="1.0.${{ github.run_number }}" packaging/build-dmg.sh --universal
      - name: Check architectures and minimum macOS
        run: |
          lipo -info "build/DMX Studio.app/Contents/MacOS/DMXStudio"
          otool -l "build/DMX Studio.app/Contents/MacOS/DMXStudio" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: DMX-Studio-dmg
          path: build/*.dmg
