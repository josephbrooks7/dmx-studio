name: Character renders (macOS)
# Renders MakeHuman characters with the app's own Swift/SceneKit code on a Mac and commits the
# images, so the in-app result can be checked without a release.
on:
  push:
    branches-ignore: [main]
    paths:
      - 'Sources/DMXStudio/MakeHumanCharacter.swift'
      - 'Sources/DMXStudio/Stage3D.swift'
      - 'Sources/DMXStudio/StageView.swift'
      - '.github/workflows/character-renders.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: character-renders-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Character pack
        run: |
          gh release download character-library-1 -R "$GITHUB_REPOSITORY" -p character-app-pack.zip -D /tmp
          mkdir -p /tmp/mhpack && unzip -q /tmp/character-app-pack.zip -d /tmp/mhpack && du -sh /tmp/mhpack
      - name: Build
        run: |
          set -o pipefail
          swift build -c debug 2>&1 | grep -E "error|MakeHuman|Build" | tail -40
      - name: Render
        run: |
          set -o pipefail
          mkdir -p packaging/makehuman/app-review
          BIN=.build/debug/DMXStudio
          export DMX_CHARACTER_LIBRARY=/tmp/mhpack
          r() { NAME=$1; shift; $BIN --character-render "packaging/makehuman/app-review/$NAME.png" "$@" 2>&1 | grep MH_ | tee -a packaging/makehuman/app-review/log.txt; }
          : > packaging/makehuman/app-review/log.txt
          rm -f packaging/makehuman/app-review/*.png packaging/makehuman/app-review/*.jpg
          r s1-studio-man Body=Masculine Skin=0 Hair=Short Clothing=Formal HairColor=4 Lighting=studio
          r s2-studio-woman Body=Feminine Skin=0 Hair=Ponytail Clothing=Glam HairColor=3 Outfit=4 Lighting=studio "Accessory=Choker"
          r s3-studio-face Body=Feminine Skin=0 Hair=Ponytail Clothing=Glam HairColor=3 Lighting=studio Face=1
          r b1-base-man Body=Masculine Skin=2 Hair=Bald Clothing=Base Lighting=studio
          r b2-base-woman Body=Feminine Skin=1 Hair=Bald Clothing=Base Lighting=studio
          r a1-tophat-curly Body=Masculine Skin=2 Hair=Curly "Clothing=Rock Jacket" Lighting=studio "Accessory=Top Hat"
          r a2-glasses Body=Masculine Skin=4 Hair=Short Clothing=Casual Lighting=studio Accessory=Glasses
          r a3-wings Body=Feminine Skin=1 Hair=Long Clothing=Fantasy Lighting=studio Accessory=Wings
          for SEX in Masculine Feminine; do
            for SLOT in outfit top bottom shoes; do
              $BIN --character-sheet "packaging/makehuman/app-review/sheet-$SEX-$SLOT.jpg" Body=$SEX Slot=$SLOT Hair=Short Lighting=studio || echo "sheet $SEX $SLOT failed"
            done
          done
          for SLOT in hat glasses wings; do
            $BIN --character-sheet "packaging/makehuman/app-review/sheet-$SLOT.jpg" Body=Feminine Slot=$SLOT Hair=Short Lighting=studio || echo "sheet $SLOT failed"
          done
          ls -la packaging/makehuman/app-review
      - name: Commit renders
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add packaging/makehuman/app-review || true
          git commit -m "Character renders (run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
