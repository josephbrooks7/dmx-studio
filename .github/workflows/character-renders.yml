name: Character renders (macOS)
# Renders MakeHuman characters with the app's own Swift/SceneKit code on a Mac and commits the
# images, so the in-app result can be checked without a release.
on:
  push:
    branches-ignore: [main]
    paths:
      - 'Sources/DMXStudio/MakeHumanCharacter.swift'
      - 'Sources/DMXStudio/HeadwearFitter.swift'
      - 'Sources/DMXStudio/Stage3D.swift'
      - 'Sources/DMXStudio/StageView.swift'
      - '.github/workflows/character-renders.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: character-renders-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Character pack
        run: |
          gh release download character-library-1 -R "$GITHUB_REPOSITORY" -p character-app-pack.zip -D /tmp
          mkdir -p /tmp/mhpack && unzip -q /tmp/character-app-pack.zip -d /tmp/mhpack && du -sh /tmp/mhpack
      - name: Build
        run: |
          set -o pipefail
          swift build -c debug 2>&1 | grep -E "error|MakeHuman|Build" | tail -40
      - name: Render
        run: |
          set -o pipefail
          mkdir -p packaging/makehuman/app-review
          BIN=.build/debug/DMXStudio
          export DMX_CHARACTER_LIBRARY=/tmp/mhpack
          r() { NAME=$1; shift; $BIN --character-render "packaging/makehuman/app-review/$NAME.png" "$@" 2>&1 | grep MH_ | tee -a packaging/makehuman/app-review/log.txt; }
          : > packaging/makehuman/app-review/log.txt
          rm -f packaging/makehuman/app-review/*.png packaging/makehuman/app-review/*.jpg
          r cap1-man-short Body=Masculine Skin=1 Hair=Short HairColor=1 Clothing=Casual "Accessory=Baseball Cap" Outfit=0 Lighting=studio Face=1
          r cap2-woman-ponytail Body=Feminine Skin=2 Hair=Ponytail HairColor=1 Clothing=Casual "Accessory=Baseball Cap" Outfit=2 Lighting=studio Face=1
          r cap3-man-curly Body=Masculine Skin=4 Hair=Curly HairColor=0 Clothing=Casual "Accessory=Baseball Cap" Outfit=1 Lighting=studio Face=1
          r cap4-woman-long Body=Feminine Skin=0 Hair=Long HairColor=2 Clothing=Casual "Accessory=Baseball Cap" Outfit=3 Lighting=studio Face=1
          r cap5-backwards Body=Masculine Skin=3 Hair=Long HairColor=0 "Clothing=Rock Jacket" "Accessory=Baseball Cap (backwards)" Outfit=4 Lighting=studio Face=1
          r cap6-full Body=Feminine Skin=2 Hair=Ponytail HairColor=1 Clothing=Casual "Accessory=Baseball Cap" Outfit=2 Lighting=studio
          $BIN --character-sheet packaging/makehuman/app-review/sheet-hats-curly.jpg Body=Masculine Skin=4 Hair=Curly HairColor=0 Clothing=Casual Slot=hat Lighting=studio Face=1 || echo "sheet failed"
          $BIN --character-sheet packaging/makehuman/app-review/sheet-hats-woman.jpg Body=Feminine Skin=2 Hair=Long HairColor=2 Clothing=Casual Slot=hat Lighting=studio Face=1 || echo "sheet failed"
          ls -la packaging/makehuman/app-review
      - name: Commit renders
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add packaging/makehuman/app-review || true
          git commit -m "Character renders (run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
