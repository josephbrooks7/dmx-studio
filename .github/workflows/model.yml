name: High Quality splitter model
on:
  push:
    paths: ["packaging/export_demucs.py", "packaging/demucs_dsp.py", ".github/workflows/model.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  model:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install Demucs + Core ML tools
        run: pip install "numpy<2" torch==2.2.2 torchaudio==2.2.2 demucs==4.0.1 coremltools==7.2 soundfile
      - name: Convert Demucs to Core ML and check it against Demucs
        run: |
          mkdir -p /tmp/v
          python packaging/make_verify_song.py /tmp/v/verify.wav --parts
          python packaging/export_demucs.py /tmp/model /tmp/v/verify.wav
      - name: Compile and publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd /tmp/model
          xcrun coremlcompiler compile DemucsHQ.mlpackage .
          ditto -c -k --keepParent DemucsHQ.mlmodelc DemucsHQ.mlmodelc.zip
          ls -la; du -sh DemucsHQ.mlmodelc
          gh release view hq-model-1 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create hq-model-1 -R "$GITHUB_REPOSITORY" --title "High Quality stem splitter model" \
              --notes "Demucs htdemucs_6s (Meta, MIT license) converted to Core ML for DMX Studio. Downloaded by the app the first time you use High Quality splitting."
          gh release upload hq-model-1 -R "$GITHUB_REPOSITORY" DemucsHQ.mlmodelc.zip DemucsHQ.json check.json --clobber
